[pytest]
# Aparte del pytest.ini de la raíz: el cleaning-agent también tiene un paquete `app`, y en un
# mismo proceso solo se puede importar uno. Desde la raíz: `pytest services/recommender`.
# Los tests unitarios importan app.index y app.recommend (numpy y scipy, en tests/requirements.txt).
testpaths = tests
pythonpath = . tests
addopts = -ra --strict-markers
