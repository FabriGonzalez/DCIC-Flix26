# Sirve el build de React y reenvía /api al backend.
# Reemplaza /etc/nginx/conf.d/default.conf de la imagen oficial.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # DNS interno de Docker. valid=10s: si el backend se recrea con otra IP, la nueva
    # se toma en 10 s como máximo, sin reiniciar el frontend.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        # Con el destino en una variable, nginx resuelve "backend" en cada pedido (con el
        # resolver de arriba) y no al arrancar: levanta aunque el backend no exista, y no
        # se queda con una IP vieja. Sin backend responde 502, y la pantalla lo informa.
        set $backend http://backend:8000;
        # El backend expone /health, no /api/health.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
    }

    # Rutas de la SPA: lo que no es un archivo del build devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html sin caché: tras un build nuevo, el navegador pide los archivos nuevos.
    # Los de /assets llevan un hash en el nombre y pueden cachearse.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
