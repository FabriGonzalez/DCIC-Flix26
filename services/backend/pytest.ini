[pytest]
# Aparte del pytest.ini de la raíz, por el mismo motivo que el recommender: cada servicio
# tiene un paquete `app`. Desde la raíz: `pytest services/backend`.
testpaths = tests
pythonpath = . ../../libs/common
addopts = -ra --strict-markers
markers =
    mongo: levanta un Mongo descartable con Docker; se saltea sin Docker
