[pytest]
testpaths = tests libs/common/tests services/cleaning-agent/tests services/ingest-consumer/tests
# El núcleo del helper no tiene dependencias: los tests importan topology.py sin instalarlo.
# Las reglas del cleaning-agent tampoco: solo usan la biblioteca estándar. Los tests contra
# Mongo (marca mongo), de ese servicio y del ingest-consumer, necesitan pymongo y Docker.
pythonpath = libs/common tests/architecture services/cleaning-agent services/ingest-consumer
# El recommender también tiene un paquete `app`, y en un mismo proceso solo se importa uno:
# sus tests corren aparte, con su propio pytest.ini (`pytest services/recommender`). Por eso
# el paquete del ingest-consumer se llama `ingest`.
# Los slow bajan el sistema y tardan minutos: se corren aparte, con `pytest -m slow`.
addopts = -ra --strict-markers -m "not slow"
markers =
    static: lee docker compose config; no necesita nada levantado
    dynamic: necesita el sistema levantado (docker compose up -d --wait)
    slow: baja y vuelve a levantar el sistema
    mongo: levanta un Mongo descartable con Docker (conftest.py); se saltea sin Docker
